[project]
name = "privatemesh"
version = "0.0.1"
description = "A personal AI that remembers you, acts for you, and can prove it only did what you allowed. Built on NVIDIA Nemotron via Nebius Token Factory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
privatemesh = "privatemesh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privatemesh"]
